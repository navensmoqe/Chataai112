<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Suna Ai - مساعدك الذكي للدردشة وتوليد الصور بالعربية">
    <meta name="theme-color" content="#7c6fff">
    <title>Suna Ai - مساعدك الذكي</title>
    
    <!-- خطوط جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- ملف التصميم -->
    <link rel="stylesheet" href="style.css">
    
    <!-- مكتبة Puter.js -->
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>

    <!-- تظليل الشاشة للموبايل عند فتح القائمة -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- ===== القائمة الجانبية ===== -->
    <div class="sidebar" id="sidebar">
        <!-- شعار التطبيق -->
        <div class="sidebar-logo">
            <div class="sidebar-logo-icon">✦</div>
            <span class="sidebar-logo-text">Suna Ai</span>
        </div>

        <!-- زر دردشة جديدة -->
        <button class="new-chat-btn" id="newChatBtn" onclick="startNewChat()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            دردشة جديدة
        </button>

        <!-- عنوان قسم المحادثات -->
        <div class="section-label">المحادثات الأخيرة</div>

        <!-- قائمة المحادثات -->
        <div class="chat-history-list" id="chatHistoryList">
            <!-- تُملأ بالجافاسكربت -->
        </div>

        <!-- ذيل القائمة الجانبية -->
        <div class="sidebar-footer">
            <!-- تصدير المحادثة -->
            <button class="sidebar-footer-btn" onclick="exportChat()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                تصدير المحادثة
            </button>
            <button class="sidebar-footer-btn" id="themeToggleBtn" onclick="toggleTheme()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <span id="themeText">وضع النهار</span>
            </button>
            <button class="sidebar-footer-btn danger" onclick="clearMemory()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                مسح الكل
            </button>
        </div>
    </div>

    <!-- ===== المحتوى الرئيسي ===== -->
    <div class="main-content">
        <!-- شريط التحكم العلوي -->
        <div class="top-bar">
            <div class="top-bar-left">
                <button class="menu-btn" onclick="toggleSidebar()" aria-label="القائمة">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <span class="top-bar-title">✦ Suna Ai</span>
                <span class="model-badge" id="modelBadge">GPT-4o</span>
            </div>
            <div class="controls">
                <!-- زر البحث -->
                <button class="icon-btn" onclick="toggleSearch()" title="بحث في المحادثة (Ctrl+F)" aria-label="بحث">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </button>

                <div class="model-select-wrapper">
                    <select id="modelSelect" onchange="updateModelBadge()" aria-label="اختر النموذج">
                        <option value="gpt-4o" selected>GPT-4o</option>
                        <option value="gpt-4o-mini">GPT-4o Mini</option>
                        <option value="gpt-4.5-preview">GPT-4.5</option>
                        <option value="claude-sonnet-4-5">Claude Sonnet</option>
                        <option value="claude-opus-4-5">Claude Opus</option>
                        <option value="gemini-2.0-flash">Gemini Flash</option>
                        <option value="gemini-2.5-pro">Gemini Pro</option>
                    </select>
                </div>
                <button class="mode-btn active" id="modeChat" onclick="setMode('chat')" aria-label="وضع الدردشة">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    دردشة
                </button>
                <button class="mode-btn" id="modeImage" onclick="setMode('image')" aria-label="وضع الصور">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    صورة
                </button>
            </div>
        </div>

        <!-- شريط البحث -->
        <div class="search-bar" id="searchBar" style="display: none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="ابحث في المحادثة..." oninput="performSearch()" onkeydown="if(event.key==='Escape')closeSearch()">
            <button class="search-close-btn" onclick="closeSearch()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <!-- منطقة عرض الرسائل -->
        <div class="chat-messages" id="chatBox"></div>

        <!-- شريط الإدخال -->
        <div class="input-area-wrapper">
            <div class="input-box" id="inputBox">
                <!-- معاينة الملف المرفق -->
                <div id="filePreviewBar" class="file-preview-bar" style="display: none;">
                    <div class="file-preview-info">
                        <img id="filePreviewThumb" class="file-preview-thumb" style="display:none;" alt="معاينة">
                        <span id="filePreviewName" class="file-preview-name"></span>
                    </div>
                    <button class="remove-file-btn" onclick="clearAttachedFile()" aria-label="إزالة الملف">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>

                <!-- صف الإدخال -->
                <div class="input-row">
                    <input type="file" id="fileInput" style="display: none;" accept="image/*, .txt, .py, .js, .json, .html, .css, .md, .csv" onchange="handleFileSelect(event)">
                    
                    <button class="attach-btn" title="إرفاق ملف" onclick="document.getElementById('fileInput').click()" aria-label="إرفاق ملف">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                    
                    <!-- زر الميكروفون -->
                    <button class="attach-btn voice-btn" id="voiceBtn" title="إدخال صوتي" onclick="toggleVoice()" aria-label="إدخال صوتي">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                    </button>
                    
                    <textarea id="userInput" rows="1" placeholder="أرسل رسالة لـ Suna Ai..." oninput="autoResize(this)" onkeydown="handleKeyDown(event)" aria-label="حقل الرسالة"></textarea>
                    
                    <button class="send-btn" id="sendBtn" onclick="processInput()" disabled aria-label="إرسال">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                    </button>
                </div>
            </div>
            <div class="input-footer-row">
                <span id="wordCounter" class="word-counter"></span>
                <span class="input-footer">Suna Ai قد يرتكب أخطاء. تحقق من المعلومات المهمة. <kbd>Ctrl+K</kbd> محادثة جديدة · <kbd>Ctrl+F</kbd> بحث · <kbd>Ctrl+E</kbd> تصدير</span>
            </div>
        </div>
    </div>

    <!-- Lightbox للصور -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img id="lightboxImg" src="" alt="صورة مكبرة">
    </div>

    <!-- Toast للإشعارات -->
    <div class="toast" id="toast"></div>

    <!-- ملف المنطق والجافاسكربت -->
    <script src="script.js"></script>
</body>
</html>
