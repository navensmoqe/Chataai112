<!DOCTYPE html>
<html class="dark" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Suna Ai - مساعدك الذكي للدردشة وتوليد الصور بالعربية">

    <!-- PWA: Theme & Status Bar -->
    <meta name="theme-color" content="#61dbb4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Suna Ai">
    <meta name="application-name" content="Suna Ai">
    <meta name="msapplication-TileColor" content="#131313">
    <meta name="msapplication-TileImage" content="icon-192.png">

    <!-- PWA: Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">

    <!-- PWA: Manifest -->
    <link rel="manifest" href="manifest.json">
    <title>Suna Ai - مساعدك الذكي</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
    <!-- Puter.js -->
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>

    <!-- Mobile Overlay -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="app-layout">

        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar" id="sidebar">

            <!-- Sidebar Header -->
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon">✦</div>
                    <span class="sidebar-logo-text">Suna Ai</span>
                </div>
                <button class="icon-btn" id="themeToggleBtn" onclick="toggleTheme()" title="تبديل الثيم">
                    <span class="material-symbols-outlined">light_mode</span>
                    <span id="themeText" style="display:none">وضع النهار</span>
                </button>
            </div>

            <!-- Model Badge -->
            <div class="sidebar-badge-row">
                <div class="model-pill">
                    <div class="model-pill-dot"></div>
                    <span id="modelBadge">GPT-5.4</span>
                </div>
            </div>

            <!-- New Chat Button -->
            <div class="sidebar-new-chat">
                <button class="new-chat-btn" id="newChatBtn" onclick="startNewChat()">
                    <span class="material-symbols-outlined">add</span>
                    دردشة جديدة
                </button>
            </div>

            <!-- Chat History -->
            <nav class="sidebar-nav">
                <div class="sidebar-section-label">المحادثات الأخيرة</div>
                <div class="chat-history-list" id="chatHistoryList"></div>
            </nav>

            <!-- Sidebar Footer -->
            <div class="sidebar-footer">
                <button class="sidebar-footer-btn install-btn" id="installBtn" onclick="installApp()" style="display:none;">
                    <span class="material-symbols-outlined">install_mobile</span>
                    تثبيت التطبيق
                </button>
                <button class="sidebar-footer-btn" onclick="exportChat()">
                    <span class="material-symbols-outlined">download</span>
                    تصدير المحادثة
                </button>
                <button class="sidebar-footer-btn danger" onclick="clearMemory()">
                    <span class="material-symbols-outlined">delete_sweep</span>
                    مسح الكل
                </button>
            </div>
        </aside>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="main-content">

            <!-- Top Bar -->
            <header class="top-bar">
                <div class="top-bar-left">
                    <!-- Menu toggle -->
                    <button class="icon-btn" onclick="toggleSidebar()" aria-label="القائمة">
                        <span class="material-symbols-outlined">menu</span>
                    </button>

                    <!-- Model Select -->
                    <div class="model-select-wrapper">
                        <span class="material-symbols-outlined model-select-arrow">expand_more</span>
                        <select id="modelSelect" onchange="updateModelBadge()" aria-label="اختر النموذج">
                            <optgroup label="🔥 GPT-5.6 (الأحدث)">
                                <option value="gpt-5.6-sol">GPT-5.6 Sol</option>
                                <option value="gpt-5.6-sol-pro">GPT-5.6 Sol Pro</option>
                                <option value="gpt-5.6-terra">GPT-5.6 Terra</option>
                                <option value="gpt-5.6-terra-pro">GPT-5.6 Terra Pro</option>
                                <option value="gpt-5.6-luna">GPT-5.6 Luna</option>
                                <option value="gpt-5.6-luna-pro">GPT-5.6 Luna Pro</option>
                            </optgroup>
                            <optgroup label="⚡ GPT-5.5">
                                <option value="gpt-5.5">GPT-5.5</option>
                                <option value="gpt-5.5-pro">GPT-5.5 Pro</option>
                            </optgroup>
                            <optgroup label="🚀 GPT-5.4">
                                <option value="gpt-5.4-nano">GPT-5.4 Nano</option>
                                <option value="gpt-5.4-mini">GPT-5.4 Mini</option>
                                <option value="gpt-5.4" selected>GPT-5.4</option>
                                <option value="gpt-5.4-pro">GPT-5.4 Pro</option>
                            </optgroup>
                            <optgroup label="💡 GPT-5.x أخرى">
                                <option value="gpt-5.3-chat">GPT-5.3 Chat</option>
                                <option value="gpt-5.2">GPT-5.2</option>
                                <option value="gpt-5.2-chat">GPT-5.2 Chat</option>
                                <option value="gpt-5.2-pro">GPT-5.2 Pro</option>
                                <option value="gpt-5.1">GPT-5.1</option>
                                <option value="gpt-5.1-chat-latest">GPT-5.1 Chat Latest</option>
                                <option value="gpt-5">GPT-5</option>
                                <option value="gpt-5-mini">GPT-5 Mini</option>
                                <option value="gpt-5-nano">GPT-5 Nano</option>
                                <option value="gpt-5-chat-latest">GPT-5 Chat Latest</option>
                            </optgroup>
                            <optgroup label="🧑‍💻 Codex">
                                <option value="gpt-5.3-codex">GPT-5.3 Codex</option>
                                <option value="gpt-5.2-codex">GPT-5.2 Codex</option>
                                <option value="gpt-5.1-codex">GPT-5.1 Codex</option>
                                <option value="gpt-5.1-codex-mini">GPT-5.1 Codex Mini</option>
                                <option value="gpt-5.1-codex-max">GPT-5.1 Codex Max</option>
                                <option value="gpt-5-codex">GPT-5 Codex</option>
                            </optgroup>
                            <optgroup label="🤖 GPT-4.x">
                                <option value="gpt-4.1">GPT-4.1</option>
                                <option value="gpt-4.1-mini">GPT-4.1 Mini</option>
                                <option value="gpt-4.1-nano">GPT-4.1 Nano</option>
                                <option value="gpt-4.5-preview">GPT-4.5 Preview</option>
                                <option value="gpt-4o">GPT-4o</option>
                                <option value="gpt-4o-mini">GPT-4o Mini</option>
                            </optgroup>
                            <optgroup label="🧠 OpenAI Reasoning">
                                <option value="o1">o1</option>
                                <option value="o1-mini">o1 Mini</option>
                                <option value="o1-pro">o1 Pro</option>
                                <option value="o3">o3</option>
                                <option value="o3-mini">o3 Mini</option>
                                <option value="o4-mini">o4 Mini</option>
                            </optgroup>
                            <optgroup label="🌟 Claude (Anthropic)">
                                <option value="claude-sonnet-4-5">Claude Sonnet 4.5</option>
                                <option value="claude-opus-4-5">Claude Opus 4.5</option>
                            </optgroup>
                            <optgroup label="✨ Gemini (Google)">
                                <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                                <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                            </optgroup>
                        </select>
                    </div>

                    <!-- Mode Buttons -->
                    <div class="mode-tabs">
                        <button class="mode-tab active" id="modeChat" onclick="setMode('chat')">
                            <span class="material-symbols-outlined">chat</span>
                            دردشة
                        </button>
                        <button class="mode-tab" id="modeImage" onclick="setMode('image')">
                            <span class="material-symbols-outlined">image</span>
                            صورة
                        </button>
                    </div>
                </div>

                <div class="top-bar-right">
                    <button class="icon-btn" onclick="toggleSearch()" title="بحث (Ctrl+F)">
                        <span class="material-symbols-outlined">search</span>
                    </button>
                    <button class="icon-btn" title="مشاركة">
                        <span class="material-symbols-outlined">share</span>
                    </button>
                    <button class="icon-btn" title="المزيد">
                        <span class="material-symbols-outlined">more_vert</span>
                    </button>
                </div>
            </header>

            <!-- Search Bar -->
            <div class="search-bar" id="searchBar" style="display:none;">
                <span class="material-symbols-outlined">search</span>
                <input type="text" id="searchInput" placeholder="ابحث في المحادثة..." oninput="performSearch()" onkeydown="if(event.key==='Escape')closeSearch()">
                <button class="icon-btn" onclick="closeSearch()">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <!-- Chat Messages Area -->
            <div class="chat-messages custom-scrollbar" id="chatBox"></div>

            <!-- Input Area -->
            <div class="input-area-wrapper">
                <div class="input-container">

                    <!-- File Preview -->
                    <div id="filePreviewBar" class="file-preview-bar" style="display:none;">
                        <div class="file-preview-info">
                            <img id="filePreviewThumb" class="file-preview-thumb" style="display:none;" alt="معاينة">
                            <span id="filePreviewName" class="file-preview-name"></span>
                        </div>
                        <button class="icon-btn" onclick="clearAttachedFile()">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>

                    <!-- Main Input Box -->
                    <div class="input-box" id="inputBox">
                        <input type="file" id="fileInput" style="display:none;" onchange="handleFileSelect(event)">

                        <div class="input-row">
                            <button class="attach-btn" title="إرفاق ملف" onclick="document.getElementById('fileInput').click()" aria-label="إرفاق ملف">
                                <span class="material-symbols-outlined">attach_file</span>
                            </button>

                            <button class="attach-btn voice-btn" id="voiceBtn" title="إدخال صوتي" onclick="toggleVoice()" aria-label="إدخال صوتي">
                                <span class="material-symbols-outlined">mic</span>
                            </button>

                            <textarea id="userInput" rows="1" placeholder="أرسل رسالة لـ Suna Ai..." oninput="autoResize(this)" onkeydown="handleKeyDown(event)" aria-label="حقل الرسالة"></textarea>

                            <button class="send-btn" id="sendBtn" onclick="processInput()" disabled aria-label="إرسال">
                                <span class="material-symbols-outlined">arrow_upward</span>
                            </button>
                        </div>
                    </div>

                    <!-- Input Footer -->
                    <div class="input-footer-row">
                        <span id="wordCounter" class="word-counter"></span>
                        <span class="input-footer">Suna Ai قد يرتكب أخطاء. تحقق من المعلومات المهمة. <kbd>Ctrl+K</kbd> جديد · <kbd>Ctrl+F</kbd> بحث · <kbd>Ctrl+E</kbd> تصدير</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img id="lightboxImg" src="" alt="صورة مكبرة">
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="script.js"></script>

    <!-- PWA: Register Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.warn('SW registration failed:', err));
            });
        }

        // PWA: Show install prompt
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Show install button if it exists
            const installBtn = document.getElementById('installBtn');
            if (installBtn) installBtn.style.display = 'flex';
        });

        window.addEventListener('appinstalled', () => {
            deferredPrompt = null;
            const installBtn = document.getElementById('installBtn');
            if (installBtn) installBtn.style.display = 'none';
            // Show confirmation
            setTimeout(() => {
                const toast = document.getElementById('toast');
                if (toast) {
                    toast.textContent = '✅ تم تثبيت Suna Ai بنجاح!';
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 3000);
                }
            }, 500);
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(result => {
                    deferredPrompt = null;
                });
            }
        }
    </script>
</body>
</html>
